name: Set up Relantern toolchains
description: Install only the pinned toolchains and dependencies a CI job needs

inputs:
  node:
    description: Install Node, pnpm, and workspace dependencies
    required: false
    default: "true"
  go:
    description: Install Go and download modules
    required: false
    default: "true"
  ci-tools:
    description: Install none or lint-scoped checksum-verified CI tools
    required: false
    default: none

runs:
  using: composite
  steps:
    - name: Install checksum-verified CI tools
      if: inputs.ci-tools != 'none'
      shell: bash
      env:
        CI_TOOL_BIN_DIR: ${{ github.workspace }}/.local/bin
        CI_TOOL_SCOPE: ${{ inputs.ci-tools }}
      # The checksum-verified fixed workspace path is controlled by this action.
      run: | # zizmor: ignore[github-env]
        bash scripts/install-ci-tools.sh "${CI_TOOL_SCOPE}"
        printf '%s\n' "${CI_TOOL_BIN_DIR}" >>"${GITHUB_PATH}"
    - name: Set up pnpm
      if: inputs.node == 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11.24.0
        run_install: false
    - name: Set up Node.js
      if: inputs.node == 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Set up Go
      if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: Install JavaScript dependencies
      if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Download Go modules
      if: inputs.go == 'true'
      shell: bash
      run: go mod download
