name: CI

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  APP_ENV: test
  ALLOW_LIVE_EXTERNAL_APIS: "false"
  ALLOW_LIVE_DELIVERY: "false"

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository toolchains
        uses: ./.github/actions/setup
        with:
          ci-tools: lint
      - name: Check formatting, lint, and workflow syntax
        run: |
          make lint
          make workflow-lint
      - name: Enforce repository and supply-chain policy
        run: bash scripts/policy-check.sh
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

  frontend-setup:
    name: frontend / setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Verify registry signatures and peer dependencies
        run: |
          pnpm audit signatures
          pnpm peers check
      - name: Reject dependency setup drift
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml apps/web/package.json packages

  frontend-lint:
    name: frontend / lint
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Run Biome
        run: pnpm lint

  frontend-typecheck:
    name: frontend / typecheck
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Run strict type checks
        run: pnpm typecheck

  frontend-test:
    name: frontend / unit tests
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Run unit tests
        run: pnpm test

  frontend-build:
    name: frontend / production build
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Build production web application
        run: pnpm build

  frontend:
    name: frontend
    if: ${{ always() }}
    needs:
      - frontend-setup
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every frontend job
        env:
          SETUP_RESULT: ${{ needs.frontend-setup.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          TYPECHECK_RESULT: ${{ needs.frontend-typecheck.result }}
          TEST_RESULT: ${{ needs.frontend-test.result }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          for result in \
            "${SETUP_RESULT}" \
            "${LINT_RESULT}" \
            "${TYPECHECK_RESULT}" \
            "${TEST_RESULT}" \
            "${BUILD_RESULT}"; do
            [[ "${result}" == "success" ]] || exit 1
          done

  go-setup:
    name: go / setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Verify module content
        run: |
          go mod verify
          go list -deps ./... >/dev/null
      - name: Reject dependency setup drift
        run: git diff --exit-code -- go.mod go.sum

  go-build:
    name: go / build
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Build production commands
        run: go build -trimpath ./cmd/...

  go-analysis:
    name: go / static analysis
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Run Go vet
        run: go vet ./...

  go-test:
    name: go / race tests
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Test with race detection
        run: go test -race -shuffle=on -count=1 ./...

  go-vulnerability:
    name: go / vulnerability analysis
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  go:
    name: go
    if: ${{ always() }}
    needs:
      - go-setup
      - go-build
      - go-analysis
      - go-test
      - go-vulnerability
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Go job
        env:
          SETUP_RESULT: ${{ needs.go-setup.result }}
          BUILD_RESULT: ${{ needs.go-build.result }}
          ANALYSIS_RESULT: ${{ needs.go-analysis.result }}
          TEST_RESULT: ${{ needs.go-test.result }}
          VULNERABILITY_RESULT: ${{ needs.go-vulnerability.result }}
        run: |
          for result in \
            "${SETUP_RESULT}" \
            "${BUILD_RESULT}" \
            "${ANALYSIS_RESULT}" \
            "${TEST_RESULT}" \
            "${VULNERABILITY_RESULT}"; do
            [[ "${result}" == "success" ]] || exit 1
          done

  db-integration:
    name: db-integration
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_DB: relantern
          POSTGRES_PASSWORD: relantern_ci_only
          POSTGRES_USER: relantern
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relantern -d relantern"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://relantern:relantern_ci_only@127.0.0.1:5432/relantern?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Apply migrations and seed
        run: |
          go run ./cmd/migrate up
          go run ./cmd/seed
      - name: Verify database extensions
        run: go test ./internal/database/... ./internal/scheduler/... ./internal/sources/...

  contract-drift:
    name: contract-drift
    needs: [frontend-setup, go-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository toolchains
        uses: ./.github/actions/setup
      - name: Generate contracts
        run: make generate
      - name: Require clean generated tree
        run: git diff --exit-code -- contracts/openapi.yaml internal/database/sqlcdb packages/api-client/src/generated/schema.ts

  source-fixtures:
    name: source-fixtures
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Verify reviewed registry and fixtures
        run: make sources-verify

  security:
    name: security
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner

  container-build-service:
    name: container / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, migrate, web, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build exact production stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: false
          target: production

  container-build:
    name: container-build
    if: ${{ always() }}
    needs: container-build-service
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every container build
        env:
          BUILD_RESULT: ${{ needs.container-build-service.result }}
        run: test "${BUILD_RESULT}" = "success"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record PR 0 browser-test boundary
        run: test -f docs/demo-route-contract.md

  demo:
    name: demo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify anonymous demo isolation contract
        run: |
          grep -Eq 'noindex,nofollow' docs/demo-route-contract.md
          ! grep -REn '@relantern/api-client|/api/v1|/api/auth' apps/web/src/app/demo
