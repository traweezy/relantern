name: CI

on:
  pull_request:
    branches: [staging, master]
  push:
    branches: [staging, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  APP_ENV: test
  ALLOW_LIVE_EXTERNAL_APIS: "false"
  ALLOW_LIVE_DELIVERY: "false"

jobs:
  policy:
    name: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository toolchains
        uses: ./.github/actions/setup
        with:
          ci-tools: lint
      - name: Check formatting, lint, and workflow syntax
        run: |
          make lint
          make workflow-lint
      - name: Enforce repository and supply-chain policy
        run: bash scripts/policy-check.sh
      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

  frontend-setup:
    name: frontend / setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Verify registry signatures and peer dependencies
        run: |
          pnpm audit signatures
          pnpm peers check
      - name: Reject dependency setup drift
        run: git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml apps/web/package.json packages

  frontend-lint:
    name: frontend / lint
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Run Biome
        run: pnpm lint

  frontend-typecheck:
    name: frontend / typecheck
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Run strict type checks
        run: pnpm typecheck

  frontend-test:
    name: frontend / unit tests
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Run unit tests
        run: pnpm test

  frontend-build:
    name: frontend / production build
    needs: frontend-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node workspace
        uses: ./.github/actions/setup
        with:
          go: "false"
      - name: Build production web application
        run: pnpm build

  frontend:
    name: frontend
    if: ${{ always() }}
    needs:
      - frontend-setup
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every frontend job
        env:
          SETUP_RESULT: ${{ needs.frontend-setup.result }}
          LINT_RESULT: ${{ needs.frontend-lint.result }}
          TYPECHECK_RESULT: ${{ needs.frontend-typecheck.result }}
          TEST_RESULT: ${{ needs.frontend-test.result }}
          BUILD_RESULT: ${{ needs.frontend-build.result }}
        run: |
          for result in \
            "${SETUP_RESULT}" \
            "${LINT_RESULT}" \
            "${TYPECHECK_RESULT}" \
            "${TEST_RESULT}" \
            "${BUILD_RESULT}"; do
            [[ "${result}" == "success" ]] || exit 1
          done

  go-setup:
    name: go / setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Verify module content
        run: |
          go mod verify
          go list -deps ./... >/dev/null
      - name: Reject dependency setup drift
        run: git diff --exit-code -- go.mod go.sum

  go-build:
    name: go / build
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Build production commands
        run: go build -trimpath ./cmd/...

  go-analysis:
    name: go / static analysis
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Run Go vet
        run: go vet ./...

  go-test:
    name: go / race tests
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Test with race detection
        run: go test -race -shuffle=on -count=1 ./...

  go-eval:
    name: go / deterministic evaluations
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Run zero-network intelligence evaluations
        run: make eval

  go-vulnerability:
    name: go / vulnerability analysis
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  storage-integration:
    name: storage-integration
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      S3_TEST_ACCESS_KEY: relantern_ci
      S3_TEST_BUCKET: relantern-ci
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_SECRET_KEY: relantern_ci_only
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Start private object storage
        run: >-
          docker run --detach --name relantern-minio-ci
          --publish 127.0.0.1:9000:9000
          --env MINIO_ROOT_USER="${S3_TEST_ACCESS_KEY}"
          --env MINIO_ROOT_PASSWORD="${S3_TEST_SECRET_KEY}"
          quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          server /data
      - name: Wait for private object storage
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs relantern-minio-ci
          exit 1
      - name: Verify staged and immutable object operations
        run: go test ./internal/storage/s3store -count=1

  go:
    name: go
    if: ${{ always() }}
    needs:
      - go-setup
      - go-build
      - go-analysis
      - go-test
      - go-eval
      - go-vulnerability
      - storage-integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every Go job
        env:
          SETUP_RESULT: ${{ needs.go-setup.result }}
          BUILD_RESULT: ${{ needs.go-build.result }}
          ANALYSIS_RESULT: ${{ needs.go-analysis.result }}
          TEST_RESULT: ${{ needs.go-test.result }}
          EVAL_RESULT: ${{ needs.go-eval.result }}
          VULNERABILITY_RESULT: ${{ needs.go-vulnerability.result }}
          STORAGE_RESULT: ${{ needs.storage-integration.result }}
        run: |
          for result in \
            "${SETUP_RESULT}" \
            "${BUILD_RESULT}" \
            "${ANALYSIS_RESULT}" \
            "${TEST_RESULT}" \
            "${EVAL_RESULT}" \
            "${VULNERABILITY_RESULT}" \
            "${STORAGE_RESULT}"; do
            [[ "${result}" == "success" ]] || exit 1
          done

  db-integration:
    name: db-integration
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_DB: relantern
          POSTGRES_PASSWORD: relantern_ci_only
          POSTGRES_USER: relantern
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relantern -d relantern"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://relantern:relantern_ci_only@127.0.0.1:5432/relantern?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Apply migrations and seed
        run: |
          go run ./cmd/migrate up
          go run ./cmd/seed
      - name: Verify database adapters
        run: go test -p 1 ./internal/database/... ./internal/dedupe/... ./internal/embedding/... ./internal/extraction/... ./internal/fetcher/pgstore/... ./internal/jobqueue/... ./internal/openaiwebhook/... ./internal/operability/... ./internal/parsing/pgstore/... ./internal/reembedding/... ./internal/research/... ./internal/retention/... ./internal/scheduler/... ./internal/search/... ./internal/sources/... ./internal/worker/...

  contract-drift:
    name: contract-drift
    needs: [frontend-setup, go-setup]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up repository toolchains
        uses: ./.github/actions/setup
      - name: Generate contracts
        run: make generate
      - name: Require clean generated tree
        run: git diff --exit-code -- contracts/openapi.yaml internal/database/sqlcdb packages/api-client/src/generated/schema.ts

  source-fixtures:
    name: source-fixtures
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
      - name: Verify reviewed registry and fixtures
        run: make sources-verify

  security:
    name: security
    needs: go-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go workspace
        uses: ./.github/actions/setup
        with:
          node: "false"
          ci-tools: security
      - name: Scan Git history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner
      - name: Scan dependency manifests with OSV
        run: osv-scanner scan source --no-call-analysis=go --recursive .
      - name: Scan source and configuration with Trivy
        run: >-
          trivy filesystem --exit-code 1 --ignore-unfixed
          --scanners vuln,misconfig --severity HIGH,CRITICAL
          --skip-dirs .git .
      - name: Audit workflow security with zizmor
        run: zizmor --persona=regular --offline .github

  container-build-service:
    name: container / ${{ matrix.service }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [api, migrate, web, worker]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned supply-chain tools
        uses: ./.github/actions/setup
        with:
          node: "false"
          go: "false"
          ci-tools: supply-chain
      - name: Configure Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build exact production stage
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          load: true
          push: false
          tags: relantern/${{ matrix.service }}:${{ github.sha }}
          target: production
      - name: Scan the exact production image
        env:
          IMAGE_NAME: relantern/${{ matrix.service }}:${{ github.sha }}
        run: >-
          trivy image --exit-code 1 --ignore-unfixed
          --scanners vuln --severity HIGH,CRITICAL
          "${IMAGE_NAME}"
      - name: Generate the image SPDX SBOM
        env:
          IMAGE_NAME: relantern/${{ matrix.service }}:${{ github.sha }}
          SBOM_PATH: dist/sbom/${{ matrix.service }}.spdx.json
        run: |
          mkdir -p dist/sbom
          syft "${IMAGE_NAME}" -o "spdx-json=${SBOM_PATH}"
      - name: Upload the image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: dist/sbom/${{ matrix.service }}.spdx.json
          if-no-files-found: error
          retention-days: 30

  container-build:
    name: container-build
    if: ${{ always() }}
    needs: container-build-service
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every container build
        env:
          BUILD_RESULT: ${{ needs.container-build-service.result }}
        run: test "${BUILD_RESULT}" = "success"

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record PR 0 browser-test boundary
        run: test -f docs/demo-route-contract.md

  demo:
    name: demo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify anonymous demo isolation contract
        run: |
          grep -Eq 'noindex,nofollow' docs/demo-route-contract.md
          ! grep -REn '@relantern/api-client|/api/v1|/api/auth' apps/web/src/app/demo
