            </entry>
          </feed>
      duplicate_story:
        body: |
          <?xml version="1.0" encoding="utf-8"?>
          <feed xmlns="http://www.w3.org/2005/Atom">
            <id>https://fixtures.example.test/atom-duplicate</id>
            <title>Duplicate Atom</title>
            <updated>2024-01-02T00:00:00Z</updated>
            <entry><id>urn:fixture:duplicate:1</id><title>Duplicate</title><link href="https://fixtures.example.test/stories/duplicate" /><updated>2024-01-01T00:00:00Z</updated></entry>
