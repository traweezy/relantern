version: 1

# The HTTP profile is shared deliberately: every connector must prove the same
# transport behavior and parser contract against one reviewed scenario set.
profiles:
  - id: http-v1
    cases:
      - id: normal
        status: 200
        payload: normal
        outcome: accepted
      - id: empty
        status: 200
        payload: empty
        outcome: empty
      - id: malformed
        status: 200
        payload: malformed
        outcome: parse_error
      - id: redirect
        status: 302
        headers:
          Location: https://fixtures.example.test/redirected
        outcome: redirect
      - id: not_modified
        status: 304
        outcome: not_modified
      - id: rate_limited
        status: 429
        headers:
          Retry-After: "120"
        outcome: retry_after
      - id: server_error
        status: 500
        outcome: retryable_error
      - id: oversized
        status: 200
        generator:
          kind: repeated-byte
          byte: x
          repeat: 15728641
          compression: ""
        outcome: body_limit
      - id: compression_bomb
        status: 200
        generator:
          kind: repeated-byte
          byte: x
          repeat: 15728640
          compression: gzip
        outcome: decompression_limit
      - id: changed_revision
        status: 200
        payload: changed_revision
        outcome: new_revision
      - id: duplicate_story
        status: 200
        payload: duplicate_story
        outcome: duplicate
      - id: prompt_injection
        status: 200
        payload: prompt_injection
        outcome: untrusted_content
      - id: character_encoding
        status: 200
        payload: character_encoding
        outcome: encoding_checked

suites:
  - id: atom-v1
    connector: atom
    profile: http-v1
    content_type: application/atom+xml; charset=utf-8
    payloads:
      normal:
        body: |
          <?xml version="1.0" encoding="utf-8"?>
          <feed xmlns="http://www.w3.org/2005/Atom">
            <id>https://fixtures.example.test/atom</id>
            <title>Fixture Atom</title>
            <updated>2024-01-02T00:00:00Z</updated>
            <entry>
              <id>urn:fixture:atom:1</id>
              <title>Stable release</title>
              <link href="https://fixtures.example.test/stories/atom-1" />
              <updated>2024-01-01T00:00:00Z</updated>
              <content type="text">A deterministic release fixture.</content>
            </entry>
          </feed>
      empty:
        body: |
          <?xml version="1.0" encoding="utf-8"?>
          <feed xmlns="http://www.w3.org/2005/Atom">
            <id>https://fixtures.example.test/atom-empty</id>
            <title>Empty Atom</title>
            <updated>2024-01-02T00:00:00Z</updated>
          </feed>
      malformed:
        body: <feed><entry><title>truncated
      changed_revision:
        body: |
          <?xml version="1.0" encoding="utf-8"?>
          <feed xmlns="http://www.w3.org/2005/Atom">
            <id>https://fixtures.example.test/atom</id>
            <title>Fixture Atom</title>
            <updated>2024-01-03T00:00:00Z</updated>
            <entry>
