    poll_interval: 24h
    priority: high
    robots_policy: api
    content_license: metadata-only
    enabled: true
    owner: system
    origin: system
    reviewed_at: 2026-08-29
    expected_content_types: [application/json]
    max_response_bytes: 10485760
    fixture_suite: registry-v1

  - <<: *registry_source
