version: 1
# Runtime network fuse. Records are reviewed, but fetching stays unavailable
# until the owner explicitly approves a staged ingestion rollout.
enabled: false
contact: https://github.com/traweezy

sources:
  - id: go-blog
    name: Go Blog
    trust_tier: T0
    connector: atom
    url: https://go.dev/blog/feed.atom
    topics: [go]
    poll_interval: 30m
    priority: critical
    robots_policy: feed
    content_license: link-and-excerpt
    enabled: true
    owner: system
    origin: system
    reviewed_at: 2026-08-29
    expected_content_types: [application/atom+xml]
    max_response_bytes: 5242880
    fixture_suite: atom-v1

  - &page_source
    id: go-release-history
    name: Go release history
    trust_tier: T0
    connector: page
    url: https://go.dev/doc/devel/release
    topics: [go, releases]
    poll_interval: 15m
    priority: critical
    robots_policy: page
    content_license: link-and-excerpt
    enabled: true
    owner: system
    origin: system
    reviewed_at: 2026-08-29
    expected_content_types: [text/html]
    max_response_bytes: 15728640
    fixture_suite: page-v1

  - <<: *page_source
    id: go-security
    name: Go security policy and announcements
    url: https://go.dev/doc/security/
    topics: [go, security]
    poll_interval: 5m

  - &rss_source
    id: typescript-blog
    name: TypeScript Blog
    trust_tier: T0
    connector: rss
    url: https://devblogs.microsoft.com/typescript/feed/
    topics: [typescript]
    poll_interval: 30m
    priority: critical
    robots_policy: feed
    content_license: link-and-excerpt
    enabled: true
    owner: system
    origin: system
    reviewed_at: 2026-08-29
    expected_content_types: [application/rss+xml]
    max_response_bytes: 5242880
    fixture_suite: rss-v1

  - <<: *page_source
    id: node-release-blog
    name: Node.js release posts
    url: https://nodejs.org/en/blog/release
    topics: [nodejs, releases]

  - <<: *page_source
    id: node-security-blog
    name: Node.js vulnerability posts
    url: https://nodejs.org/en/blog/vulnerability
    topics: [nodejs, security]
    poll_interval: 5m

  - <<: *rss_source
