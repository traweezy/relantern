services:
  api:
    build:
      target: development
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
    develop:
      watch:
        - action: sync+restart
          path: ./cmd/api
          target: /workspace/cmd/api
        - action: sync+restart
          path: ./internal
          target: /workspace/internal
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum

  worker:
    build:
      target: development
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
    develop:
      watch:
        - action: sync+restart
          path: ./cmd/worker
          target: /workspace/cmd/worker
        - action: sync+restart
          path: ./internal
          target: /workspace/internal
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum

  web:
    build:
      target: development
    environment:
      NODE_ENV: development
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/node
        - -e
        - fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
    develop:
      watch:
        - action: sync
          path: ./apps/web/src
          target: /workspace/apps/web/src
        - action: sync
          path: ./apps/web/public
          target: /workspace/apps/web/public
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./apps/web/next.config.ts
        - action: rebuild
          path: ./apps/web/tsconfig.json
        - action: rebuild
          path: ./packages/api-client/src/generated
        - action: rebuild
          path: ./pnpm-lock.yaml
