info:
  title: Relantern API
  version: 0.0.0
openapi: 3.1.0
paths:
  /api/v1/annotations/{annotationId}:
    delete:
      operationId: delete-annotation
      parameters:
        - in: path
          name: annotationId
          required: true
          schema:
            maxLength: 36
            minLength: 36
            type: string
        - in: header
          name: Authorization
          schema:
            type: string
        - in: header
          name: X-Relantern-User-ID
          schema:
            maxLength: 36
            minLength: 36
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete an owner annotation
      tags:
        - reading-state
    patch:
      operationId: update-annotation
      parameters:
        - in: path
          name: annotationId
          required: true
          schema:
            maxLength: 36
            minLength: 36
            type: string
        - in: header
          name: Authorization
          schema:
            type: string
        - in: header
          name: X-Relantern-User-ID
          schema:
            maxLength: 36
            minLength: 36
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnotationBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annotation"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update an owner annotation body
      tags:
        - reading-state
  /api/v1/archive:
    get:
      operationId: get-archive
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - in: header
          name: X-Relantern-User-ID
          schema:
            maxLength: 36
            minLength: 36
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the owner archive reading collection
      tags:
        - reading-state
  /api/v1/healthz:
    get:
      operationId: get-health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get API process health
      tags:
        - operations
  /api/v1/inbox:
    get:
      operationId: get-inbox
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
        - explode: false
          in: query
          name: cursor
          schema:
            maxLength: 512
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - in: header
          name: X-Relantern-User-ID
          schema:
            maxLength: 36
            minLength: 36
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get the owner inbox reading collection
      tags:
        - reading-state
  /api/v1/later:
    get:
